; OPcache para el servidor de desarrollo de Sail (php artisan serve usa PHP de consola).
; Guarda el código PHP ya compilado en memoria, así cada petición no lo vuelve a compilar.
; validate_timestamps + revalidate_freq=0: un archivo editado se vuelve a leer de inmediato.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
